name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore WebApp/WebApp/WebApp.csproj
      - run: dotnet build WebApp/WebApp/WebApp.csproj --no-restore
      - run: dotnet format WebApp/WebApp/WebApp.csproj --verify-no-changes
